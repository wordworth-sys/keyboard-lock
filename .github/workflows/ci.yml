name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build single-file executable (csc.exe)
        shell: pwsh
        run: .\build.ps1

      - name: Build SDK project (dotnet build)
        shell: pwsh
        run: dotnet build -t:Rebuild --nologo

      - name: Run unit and off-screen rendering tests
        shell: pwsh
        run: .\tests\run-tests.ps1
