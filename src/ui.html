<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Keyboard Lock</title>
  <style>
    :root {
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      --font-mono: "Segoe UI Mono", "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; user-select: none; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
    html, body {
      width: 400px;
      height: 264px;
      background: transparent;
      font-family: var(--font-ui);
      overflow: hidden;
    }
    .chassis {
      position: relative;
      width: 400px;
      height: 264px;
      border-radius: 16px;
      background:
        radial-gradient(125% 65% at 50% -6%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.36) 38%, rgba(255,255,255,0) 68%),
        linear-gradient(90deg, rgba(25,32,42,0.10) 0%, rgba(255,255,255,0.28) 6%, rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, rgba(255,255,255,0.28) 94%, rgba(25,32,42,0.12) 100%),
        linear-gradient(180deg, #f0f3f7 0%, #e1e6ed 22%, #d3d9e2 52%, #c1c8d3 82%, #aeb6c3 100%);
      border: 1px solid #68707c;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.98),
        inset 0 3px 5px rgba(255, 255, 255, 0.55),
        inset 0 -3px 0 #7a8390,
        inset 0 -4px 0 rgba(255, 255, 255, 0.45),
        inset 1.5px 0 0 rgba(255, 255, 255, 0.75),
        inset -1.5px 0 0 rgba(255, 255, 255, 0.75);
      overflow: hidden;
    }
    .chassis::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .titlebar {
      position: relative; z-index: 2; height: 36px; padding: 0 14px;
      display: flex; align-items: center; justify-content: space-between; cursor: move;
      background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(220,226,234,0.45) 55%, rgba(180,188,200,0.38) 100%);
      border-bottom: 1px solid #828b98;
      box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.98), 0 1px 0 rgba(255,255,255,0.85);
    }
    .traffic-lights { display: flex; align-items: center; gap: 8px; width: 52px; cursor: default; }
    .aqua-dot {
      position: relative; width: 12px; height: 12px; border-radius: 50%; cursor: pointer;
      box-shadow: 0 1px 0 rgba(255,255,255,0.9), inset 0 1px 1.5px rgba(0,0,0,0.5);
    }
    .aqua-dot::after {
      content: ""; position: absolute; top: 1.5px; left: 2.5px; width: 7px; height: 4px; border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.12) 100%);
    }
    .aqua-dot.red { background: radial-gradient(circle at 50% 85%, #ff8a80 0%, #e53935 55%, #8e1412 100%); border: 1px solid #731816; }
    .aqua-dot.yellow { background: radial-gradient(circle at 50% 85%, #ffe57f 0%, #f9a825 55%, #8c5808 100%); border: 1px solid #754b09; }
    .window-title { font-size: 13px; font-weight: 700; color: #242a32; letter-spacing: 0.03em; text-shadow: 0 1px 0 rgba(255,255,255,0.88); pointer-events: none; }
    .model-tag { width: 52px; text-align: right; font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #545d68; text-shadow: 0 1px 0 rgba(255,255,255,0.82); pointer-events: none; }

    .panel-body { position: relative; z-index: 2; padding: 15px 18px; display: flex; flex-direction: column; gap: 13px; }
    .recessed-module {
      position: relative; height: 84px; border-radius: 12px; padding: 4px;
      background: linear-gradient(180deg, #121417 0%, #20242a 100%);
      border-top: 1.5px solid #0b0c0e; border-bottom: 1.5px solid rgba(255,255,255,0.92);
      box-shadow: inset 0 4px 9px rgba(0,0,0,0.88), 0 1.5px 0 rgba(255,255,255,0.9);
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; cursor: pointer;
    }
    .mech-slider-bay {
      position: relative;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 2px, rgba(0,0,0,0.22) 2px, rgba(0,0,0,0.22) 4px), linear-gradient(180deg, #0d0f12 0%, #1a1d22 100%);
      border-radius: 8px; padding: 4px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.95);
      display: flex; align-items: center; overflow: hidden;
    }
    .rail-under-label {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-family: var(--font-mono); font-size: 9px; font-weight: 800; color: #5c6470; pointer-events: none; z-index: 1;
    }
    .rail-under-label.left { left: 8px; }
    .rail-under-label.right { right: 8px; }
    .slider-thumb {
      position: relative; z-index: 2; width: 72%; height: 100%; border-radius: 6px;
      background: linear-gradient(180deg, #f8fafc 0%, #e4e9f0 56%, #cbd2dc 100%);
      border: 1px solid #0b0d10; box-shadow: inset 0 1.5px 0 #ffffff, inset 0 -3px 0 #9aa3b0, 0 3px 6px rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .chassis.is-locked .slider-thumb { transform: translateX(38.88%); }
    .thumb-label { font-family: var(--font-mono); font-size: 11px; font-weight: 800; color: #2c333d; text-shadow: 0 1px 0 #fff; }
    .grip-ridges { display: flex; gap: 3px; height: 22px; align-items: center; }
    .grip-ridge { width: 2px; height: 100%; background: #8d96a5; box-shadow: 1px 0 0 rgba(255,255,255,0.95); }

    .status-display-window {
      position: relative; border-radius: 8px;
      background: linear-gradient(165deg, rgba(255,255,255,0.11) 0%, rgba(255,255,255,0.02) 42%, rgba(0,0,0,0.22) 42.5%, rgba(0,0,0,0.42) 100%), linear-gradient(180deg, #121519 0%, #1b2026 100%);
      border: 1px solid #090a0c; box-shadow: inset 0 2px 6px rgba(0,0,0,0.88);
      display: flex; align-items: center; padding: 0 14px; gap: 12px;
    }
    .led-bezel {
      width: 18px; height: 18px; border-radius: 50%; padding: 2px;
      background: conic-gradient(from 0deg, #525862, #1f2328, #7b8492, #1b1e23, #525862);
      box-shadow: 0 1px 0 rgba(255,255,255,0.22), inset 0 1px 2px rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .led-lens {
      position: relative; width: 12px; height: 12px; border-radius: 50%;
      background: radial-gradient(circle at 50% 65%, #a7f3d0 0%, #10b981 45%, #065f46 85%, #022c22 100%);
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.85), 0 0 14px rgba(16, 185, 129, 0.45);
    }
    .led-lens::after {
      content: ""; position: absolute; top: 1.5px; left: 2.5px; width: 5px; height: 3px;
      border-radius: 50%; background: rgba(255,255,255,0.92);
    }
    .chassis.is-locked .led-lens {
      background: radial-gradient(circle at 50% 65%, #fecaca 0%, #ef4444 45%, #991b1b 85%, #450a0a 100%);
      box-shadow: 0 0 7px rgba(239, 68, 68, 0.9), 0 0 16px rgba(239, 68, 68, 0.5);
    }
    .status-cn { font-size: 15px; font-weight: 700; color: #f3f4f6; line-height: 1.15; }
    .status-en { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; color: #6ee7b7; letter-spacing: 0.14em; }
    .chassis.is-locked .status-en { color: #fca5a5; }

    .main-btn-slot {
      padding: 3px; border-radius: 12px;
      background: linear-gradient(180deg, #6e7784 0%, #99a3b1 100%);
      border-top: 1px solid #525965; border-bottom: 1.5px solid rgba(255,255,255,0.92);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.52), 0 1px 0 rgba(255,255,255,0.88);
    }
    .main-action-btn {
      width: 100%; height: 54px; border-radius: 9px; cursor: pointer;
      background: radial-gradient(80% 100% at 50% 0%, #ffffff 0%, rgba(255,255,255,0) 70%), linear-gradient(180deg, #fbfcfe 0%, #ebeff5 55%, #d8dfe8 100%);
      border: 1px solid #454c56; box-shadow: inset 0 1.5px 0 #ffffff, inset 0 -3.5px 0 #b0b9c6, 0 3px 5px rgba(0,0,0,0.36);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 16px; font-weight: 700; color: #262c34; letter-spacing: 0.08em; text-shadow: 0 1px 0 #fff;
    }
    .main-action-btn:active { transform: translateY(2px); box-shadow: inset 0 1px 2px rgba(0,0,0,0.25); }
    .chassis.is-locked .main-action-btn {
      background: radial-gradient(90% 90% at 50% 0%, rgba(255, 185, 165, 0.5) 0%, transparent 65%), linear-gradient(180deg, #e0523b 0%, #c83a24 58%, #ab2a16 100%);
      border-color: #3d0f07; color: #fff; text-shadow: 0 -1px 1px rgba(90, 15, 5, 0.8);
      box-shadow: inset 0 1.5px 0 rgba(255, 220, 210, 0.7), inset 0 -3.5px 0 #7a190a, 0 3px 5px rgba(0,0,0,0.4);
    }

    .bottom-footer { display: flex; align-items: center; justify-content: space-between; }
    .shortcut-group { display: flex; align-items: center; gap: 5px; }
    .keycap-well {
      padding: 2px; border-radius: 7px; background: #788290;
      border-top: 1px solid #555d69; border-bottom: 1px solid rgba(255,255,255,0.9);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.48);
    }
    .keycap {
      position: relative; min-width: 38px; height: 28px; padding: 0 8px; border-radius: 5px;
      background: linear-gradient(180deg, #f8fafc 0%, #d5dce6 70%, #b4becc 100%);
      border: 1px solid #48505c; box-shadow: inset 0 1px 0 #fff, 0 2px 3px rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
    }
    .keycap::before {
      content: ""; position: absolute; inset: 2.5px 3.5px 5px 3.5px; border-radius: 3.5px;
      background: linear-gradient(180deg, #e1e7ef 0%, #f8fafc 100%);
      box-shadow: inset 0 1px 2px rgba(15,23,42,0.14), 0 1px 0 rgba(255,255,255,0.95);
    }
    .keycap span { position: relative; z-index: 1; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: #262c34; text-shadow: 0 1px 0 #fff; transform: translateY(-0.5px); }
    .plus-sign { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: #4f5864; text-shadow: 0 1px 0 rgba(255,255,255,0.88); }
    .engraved-note { font-size: 11px; font-weight: 600; color: #4b535f; text-shadow: 0 1px 0 rgba(255,255,255,0.9); }
  </style>
</head>
<body>
  <div class="chassis" id="chassis">
    <div class="titlebar" id="titlebar">
      <div class="traffic-lights">
        <div class="aqua-dot red" id="btnClose" title="关闭并最小化到托盘"></div>
        <div class="aqua-dot yellow" id="btnMinimize" title="最小化"></div>
      </div>
      <div class="window-title" id="windowTitle">键盘锁</div>
      <div class="model-tag">ALU-01</div>
    </div>
    <div class="panel-body">
      <div class="recessed-module" id="toggleBay">
        <div class="mech-slider-bay">
          <span class="rail-under-label left">FREE</span>
          <span class="rail-under-label right">HOLD</span>
          <div class="slider-thumb">
            <span class="thumb-label">LOCK</span>
            <div class="grip-ridges"><div class="grip-ridge"></div><div class="grip-ridge"></div><div class="grip-ridge"></div></div>
          </div>
        </div>
        <div class="status-display-window">
          <div class="led-bezel"><div class="led-lens"></div></div>
          <div>
            <div class="status-cn" id="statusCn">未锁定</div>
            <div class="status-en" id="statusEn">UNLOCKED</div>
          </div>
        </div>
      </div>
      <div class="main-btn-slot">
        <button class="main-action-btn" id="btnToggle" type="button">
          <span id="btnText">锁定键盘</span>
        </button>
      </div>
      <div class="bottom-footer">
        <div class="shortcut-group">
          <div class="keycap-well"><div class="keycap"><span>Ctrl</span></div></div><span class="plus-sign">+</span>
          <div class="keycap-well"><div class="keycap"><span>Alt</span></div></div><span class="plus-sign">+</span>
          <div class="keycap-well"><div class="keycap"><span>U</span></div></div>
        </div>
        <div class="engraved-note">关闭窗口后仍在托盘运行</div>
      </div>
    </div>
  </div>

  <script>
    let isLocked = false;
    const chassis = document.getElementById('chassis');
    const statusCn = document.getElementById('statusCn');
    const statusEn = document.getElementById('statusEn');
    const btnText = document.getElementById('btnText');
    const windowTitle = document.getElementById('windowTitle');

    function sendCommand(cmd) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ command: cmd });
      } else if (cmd === 'toggle') {
        renderState(!isLocked);
      }
    }

    function renderState(locked) {
      isLocked = !!locked;
      chassis.classList.toggle('is-locked', isLocked);
      statusCn.textContent = isLocked ? '已锁定' : '未锁定';
      statusEn.textContent = isLocked ? 'LOCKED' : 'UNLOCKED';
      btnText.textContent = isLocked ? '解锁键盘' : '锁定键盘';
      windowTitle.textContent = isLocked ? '键盘锁 — 已锁定' : '键盘锁';
    }

    document.getElementById('toggleBay').addEventListener('click', () => sendCommand('toggle'));
    document.getElementById('btnToggle').addEventListener('click', () => sendCommand('toggle'));
    document.getElementById('btnClose').addEventListener('click', (e) => { e.stopPropagation(); sendCommand('hide'); });
    document.getElementById('btnMinimize').addEventListener('click', (e) => { e.stopPropagation(); sendCommand('minimize'); });
    document.getElementById('titlebar').addEventListener('mousedown', (e) => {
      if (!e.target.closest('.traffic-lights')) sendCommand('drag');
    });

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', event => {
        const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (data && typeof data.locked !== 'undefined') {
          renderState(data.locked);
        }
      });
    }
  </script>
</body>
</html>
